name: checkout-service

on: 
    pull_request:
        branches:
        - main

jobs:
    build:      
        runs-on: ubuntu-latest

        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Setup Go 1.22
          uses: actions/setup-go@v2
          with:
            go-version: 1.22
        
        - name: Build
          run: |
            cd src/product-catalog
            go mod download
            go build -o product-catalog-service main.go
            

        - name: unit tests
          run: |
            cd src/product-catalog
            go test ./...

    code-quality:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v4 

        - name: run golangci-lint
          run: |
                go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.56.2
                golangci-lint run ./src/product-catalog/...

    docker:
        runs-on: ubuntu-latest
        needs: build

        steps:
        - name: checkout code
          uses: actions/checkout@v4 

        - name: install docker
          run: |
                sudo apt-get update
                sudo apt-get install -y docker.io

        - name: login to docker hub
          uses: docker/login-action@v2
          with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}

        - name: doker push
          uses: docker/build-push-action@v6
          with:
            context: .
            file: src/product-catalog/Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}} 

    updatek8s:
        runs-on: ubuntu-latest
        needs: docker

        steps:
        - name: checkout code
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}
        - name: update tag in k8s deployment manifest
          run: |
                    sed -i "s|image: .*|image: rohitpotdar/product-catalog: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{github.run_id}}|g" kubernetes/productcatalog/deploy.yaml


        - name: commit and push changes
          run: |
                git config --global user.name "Rohit Potdar"
                git config --global user.email "rohitpotdar55@gmail.com"
                git add kubernetes/productcatalog/deploy.yaml   
                git commit -m "[CI]"update product catalog image tag"
                git push