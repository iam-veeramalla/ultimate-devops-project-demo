# CI for Product Catalog Service

name: Product-Catalog-CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-Latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: Build
        run: go build -o product-catalog-service src/product-catalog-service/main.go
        
      - name: Run Tests
        run: go test src/product-catalog/...

  code-quality:
    runs-on: ubuntu-Latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run golandci-Lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.52.2
          golangci-lint run ./src/product-catalog/...

  docker:
    runs-on: ubuntu-Latest

    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Docker
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Docker Push
      uses: docker/build-push-action@v6
      with:
        context: src/product-catalog
        file: Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{github.run_id}}
    

  updatek8s:
    runs-on: ubuntu-Latest
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update tag in kubernetes deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "Update image tag to ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}"
          git push