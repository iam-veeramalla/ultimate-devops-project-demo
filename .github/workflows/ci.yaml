#CI for product catalog service

name: product-catalogue-ci

on:
    pull_request:
        branches:
           - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            
            - name: set up go
              uses: actions/setup-go@v2
              with:
                    go-version: 1.22 
            - name: build
              run: |
                cd src/product-catalog
                go mod download
                go build -o main.go
            - name: run tests
              run: |
                cd src/product-catalog
                go test ./...  
    
    code-quality:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
        
            - name: run code quality checks
              run: |
                cd src/product-catalog
                go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.56.2
                golangci-lint run --timeout 5m
    
    docker-build:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: set up docker
              uses: docker/setup-buildx-action@v2
            
            - name: log in to docker hub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
            
            - name: Docker build and push
              uses: docker/build-push-action@v6
              with:
                context: ./src/product-catalog
                push: true
                tags: ${{ secrets.DOCKER_USERNAME }}/product-catalogue-service:${{ github.run_id }}
    
    update-k8s-deployment:
        runs-on: ubuntu-latest
        needs: docker-build
        steps:
            - name: checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
            
            
            - name: update tag in kubenetes deployment manifest
              run: |
                sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalogue-service:${{ github.run_id }}|" kubernetes/product-catalog/deploy.yaml
            
            - name: commit and push changes
              run: |
                git config --global user.name ${{ github.actor }}"
                git config --global user.email "alekhyakandregula@gmail.com"
                git add kubernetes/product-catalog/deploy.yaml
                git commit -m "Update image tag to ${{ github.run_id }}"
                git push