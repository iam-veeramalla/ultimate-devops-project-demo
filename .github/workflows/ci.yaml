#CI for product catalog service

name: product-catalog-ci

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: checkout code
      uses: actions/checkout@v4
      
    - name: setup Go 1.22
      uses: actions/setup-go@v2
      with:
        go-version: 1.22
    
    - name: Build
      run: |
          cd src/product-catalog
          go mod download
          go build -o product-catalog-service src/product-catalog/main.go

    - name: unit tests
      run: go test src/product-catalog/...

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v4
    
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v2.15.0
        run: golangci-lint run
        working-directory: src/product-catalog

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Install Docker
        uses: docker/setup-buildx-action@v1
      
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}
      - name: Docker Push
        uses: docker/build-push-action@v7
        with:
          context: src/product-catalog
          file: Dockerfile
          push: true
          tag: ${{secrets.DOCKER_USERNAME}}/product-catalog:${{github.run_id}}
          
  updatek8s:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{secrets.TOKEN}}
      - name: Update tag in kubernetes deployment manifest
        run: | 
            sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml
      - name: commit and push changes
        run: |
            git config --global user.email "charankumar.chennareddy@gmail.com"
            git config --global user.name "charan006"
            git add kubernetes/productcatalog/deploy.yaml
            git commit -m "[CI]: Update product catalog image tag"
            git push origin HEAD:main -f


    
      
